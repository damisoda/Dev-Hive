name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devhive
          POSTGRES_PASSWORD: devhive
          POSTGRES_DB: devhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devhive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://devhive:devhive@localhost:5432/devhive
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install "scikit-learn>=1.2,<2.0"

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v --tb=short
