# HIVE-52: 맥미니 운영 스택 — pgvector + FastAPI 백엔드.
# 프런트(Next.js)는 Vercel에서 서빙하고 이 스택의 API를 터널 도메인으로 호출한다.
#
# 실행: cd deploy/macmini && docker compose -f docker-compose.prod.yml up -d --build
# 환경: 같은 디렉토리의 .env (deploy/macmini/.env.example 참고 — git에 올리지 말 것)
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/macmini/.env에 설정}
      POSTGRES_DB: devhive
    volumes:
      - devhive_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhive -d devhive"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 호스트 노출 불필요(백엔드가 내부 네트워크로 접속). 복원/점검은 docker exec 사용.

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://devhive:${POSTGRES_PASSWORD}@db:5432/devhive
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?}
      JWT_SECRET: ${JWT_SECRET:?}   # HIVE-100 인증 — .env에 설정
      ENABLE_SCHEDULER: "false"   # 결정사항: 끄고 시작 — 재크롤은 수동 트리거
      # LLM 백엔드 토글: 로컬 EXAONE(ollama)로 전환해 크레딧 의존 제거. ollama는 호스트에서 네이티브
      # 실행(Metal 가속) → 컨테이너는 host.docker.internal로 접속. anthropic으로 되돌리려면 .env에서 변경.
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct-GGUF:Q4_K_M}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # colima/Linux에서 컨테이너→호스트 ollama 접속
    ports:
      - "127.0.0.1:8000:8000"     # 외부 노출은 터널(cloudflared/tailscale)로만

  # 공개 프런트(Next.js, RocketPunch) — HIVE-71. Funnel 443 → 3000.
  # 서버 컴포넌트/BFF가 backend를 내부망(http://backend:8000)으로 호출 → 브라우저 CORS 없음.
  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000   # 같은 compose 네트워크 — 서버사이드 호출
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"             # 외부 노출은 Funnel(→3000)로만

volumes:
  devhive_pgdata:
