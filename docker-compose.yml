# 로컬 개발용 PostgreSQL + pgvector
# 사용법: docker compose up -d
# 종료:   docker compose down

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: devhive-db
    environment:
      POSTGRES_USER: devhive
      POSTGRES_PASSWORD: devhive
      POSTGRES_DB: devhive
    ports:
      - "5432:5432"
    volumes:
      - devhive_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devhive"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devhive_pgdata:
